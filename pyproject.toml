[project]
name = "openf1py"
version = "0.1.0"
description = "A Python client for the OpenF1 API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["formula1", "f1", "openf1", "motorsport", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://github.com/Aditya-Singh-3112/OpenF1Py"
Issues = "https://github.com/Aditya-Singh-3112/OpenF1Py/issues"
