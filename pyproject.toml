[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openf1py"
version = "0.1.0"
description = "A Python client for the OpenF1 API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/openf1py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
